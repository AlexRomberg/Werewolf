x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 100

services:
  server:
    <<: *hardened
    image: ghcr.io/alexromberg/werewolf-server:latest
    pull_policy: always
    mem_limit: 256m
    tmpfs: [/tmp]
    expose: ['3000']

  web:
    <<: *hardened
    image: ghcr.io/alexromberg/werewolf-web:latest
    pull_policy: always
    mem_limit: 128m
    tmpfs: [/tmp]
    depends_on:
      server:
        condition: service_healthy
