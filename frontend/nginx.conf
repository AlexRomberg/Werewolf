set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
limit_req_zone $binary_remote_addr zone=socket_requests_per_ip:10m rate=10r/s;
limit_conn_status 429;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_accept_language $preferred_locale {
  default en;
  ~*^de de;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  absolute_redirect off;
  client_max_body_size 32k;

  location /socket.io/ {
    include /etc/nginx/snippets/security-headers.conf;
    limit_conn connections_per_ip 20;
    limit_req zone=socket_requests_per_ip burst=40 nodelay;

    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 1h;
  }

  # The service worker scripts keep a fixed name across deploys, so they must
  # be revalidated, unlike the hashed bundles below. Regex locations match in
  # order, so this has to come first.
  location ~ /(?:ngsw-worker|safety-worker|worker-basic\.min)\.js$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable" always;
    expires 1y;
    try_files $uri =404;
  }

  location ~ /\. {
    return 404;
  }

  location ~ ^/(?<locale>en|de)(?:/|$) {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /$locale/index.html;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    return 302 /$preferred_locale$request_uri;
  }
}
