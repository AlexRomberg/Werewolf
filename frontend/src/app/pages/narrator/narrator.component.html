<div class="grid grid-cols-[1fr_28rem] min-h-svh h-svh max-h-svh">
  <div>
    <app-circle
      [people]="people()"
      [editMode]="true"
      (personRemoved)="removePerson($event)"
      (personAdded)="addPerson()"
      (personMoved)="movePerson($event)"
    />
  </div>
  <div class="bg-zinc-900 m-4 rounded-lg shadow-zinc-950 shadow p-4 flex flex-col gap-4 z-10"></div>
</div>
