<app-landscape />
<main class="mx-auto flex min-h-svh max-w-3xl flex-col gap-4 px-4 pt-4 pb-16">
  <header class="flex items-center gap-2">
    <a
      class="icon-btn -ml-2"
      routerLink="/"
      aria-label="Back to the start page"
      i18n-aria-label="@@common.backToStart"
    >
      <svg lucideChevronLeft size="22"></svg>
    </a>
    <h1 class="flex-1 truncate text-3xl" i18n="@@cards.title">Characters</h1>

    <span class="flex items-baseline gap-2">
      <span class="input-label max-sm:hidden" i18n="@@grouping.label">Group by:</span>
      <app-grouping-toggle [(grouping)]="grouping" />
    </span>
  </header>

  <div class="surface flex flex-col gap-8 bg-night-900/95 p-5">
    @for (section of sections(); track section.label) {
      <section class="flex flex-col gap-3">
        <div class="flex flex-col gap-1.5">
          <h2 class="section-title">{{ section.label }}</h2>
          <app-divider align="start" />
        </div>
        <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
          @for (character of section.characters; track character.id) {
            <app-character-tile
              [character]="character"
              (pressed)="describedCharacter.set(character)"
            />
          }
        </div>
      </section>
    }
  </div>
</main>

@if (describedCharacter(); as character) {
  <app-character-details [character]="character" (closed)="describedCharacter.set(null)" />
}
