<div class="grid h-full w-full place-items-center">
  <div
    #stage
    class="circle-stage relative aspect-square w-full max-w-[min(100%,calc(100svh))] select-none"
    [class.animated]="animated()"
    role="group"
  >
    <!-- Background -->
    <svg
      class="pointer-events-none absolute size-full stroke-zinc-800 fill-none"
      viewBox="0 0 100 100"
    >
      <path
        d="M 39.647 88.637 A 40 40 0 1 1 60.353 88.637"
        pathLength="100"
        stroke-width="0.5"
        stroke-linecap="round"
        stroke-dasharray="0.5 1.5 0.5 0"
      />
    </svg>

    <!-- Player -->
    @for (player of placedPlayers(); track player.person.id) {
      <div
        class="player"
        [class.dragging]="player.dragging"
        [style.--player-angle]="player.angle + 'deg'"
      >
        <div class="player-body" [animate.enter]="enterAnimation()" animate.leave="player-leave">
          @if (player.person.name) {
            <span
              class="text-xs absolute block truncate max-w-24 px-2 py-0.5 bg-zinc-950 rounded-full"
              [class.translate-x-9]="!player.nameTop"
              [class.-translate-y-14]="player.nameTop"
            >
              {{ player.person.name }}
            </span>
          }
          <div class="absolute -translate-x-1/2 -translate-y-1/2">
            <button
              class="circle bg-zinc-800 text-zinc-100 touch-none"
              [class.cursor-grab]="!player.dragging"
              [class.cursor-grabbing]="player.dragging"
              [class.shake]="!player.dragging && editMode()"
              [style.animationDelay]="-$index + 's'"
              (pointerdown)="onPointerDown($event, player.person.id)"
              (pointermove)="onPointerMove($event)"
              (pointerup)="onPointerUp()"
              (pointercancel)="onPointerCancel()"
              (click)="onSelect(player.person.id)"
            >
              @if (player.person.character) {
                <img
                  width="60"
                  height="60"
                  [ngSrc]="`img/${player.person.character.id}.png`"
                  [alt]="player.person.character.name"
                />
              } @else {
                <svg lucideUser />
              }
            </button>

            @if (editMode()) {
              <button
                class="absolute -right-1 -top-1 size-6 rounded-full bg-red-700 text-white"
                [class.shake]="!player.dragging && editMode()"
                [style.animationDelay]="-$index + 's'"
                (click)="personRemoved.emit(player.person.id)"
              >
                <svg class="size-4 mx-auto" lucideX />
              </button>
            }
          </div>
        </div>
      </div>
    }

    @if (editMode()) {
      <button
        class="circle absolute left-1/2 top-9/10 -translate-x-1/2 -translate-y-1/2 border-dashed disabled:opacity-30"
        [disabled]="!canAdd()"
        (click)="personAdded.emit()"
      >
        <svg class="self-center mx-auto" lucideUserRoundPlus />
      </button>
    }
  </div>
</div>
