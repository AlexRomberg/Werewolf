@if (code(); as code) {
  <div class="relative">
    <div
      class="rounded-surface bg-frost-50 p-2 shadow-xl shadow-black/60 transition-opacity"
      [class.opacity-30]="!connected()"
    >
      <app-qr-code
        class="block size-[min(15rem,34cqw)]"
        [value]="joinUrl()"
        label="QR code to join the room"
        i18n-label="@@roomInvite.qrLabel"
      />
    </div>
    @if (!connected()) {
      <p
        class="absolute inset-0 grid place-items-center text-sm font-medium text-frost-50"
        role="status"
        i18n="@@common.reconnecting"
      >
        Reconnecting…
      </p>
    }
  </div>
  <p class="mt-3 text-sm text-frost-400 @max-[24rem]:hidden" i18n="@@roomInvite.code">Room code</p>
  <p class="font-display text-3xl tracking-[0.2em] text-frost-50 tabular-nums @max-[24rem]:mt-2">
    {{ formattedCode() }}
  </p>
  <div class="mt-1 flex max-w-[min(20rem,64cqw)] items-center gap-0.5">
    <span class="min-w-0 text-sm text-frost-200 select-all [overflow-wrap:anywhere]">
      {{ shownUrl() }}
    </span>
    <button
      class="icon-btn size-9"
      [attr.aria-label]="copied() ? copiedLabel : shareLabel"
      [attr.title]="copied() ? copiedLabel : shareLabel"
      (click)="share()"
    >
      @if (copied()) {
        <svg lucideCheck size="16"></svg>
      } @else {
        <svg lucideShare2 size="16"></svg>
      }
    </button>
  </div>
} @else {
  <p class="text-sm text-frost-400" role="status" i18n="@@roomInvite.opening">Opening the room…</p>
}
