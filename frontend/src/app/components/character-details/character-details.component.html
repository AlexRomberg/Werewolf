<dialog
  appModal
  #modal="appModal"
  class="m-auto w-[min(42rem,calc(100vw-2rem))] overflow-visible bg-transparent pt-24 text-frost-200"
  aria-labelledby="character-details-name"
  (closed)="closed.emit()"
>
  <div class="surface relative flex max-h-[calc(100svh-10rem)] flex-col shadow-2xl shadow-black/60">
    <app-corners />
    <div
      class="absolute -top-24 left-1/2 size-40 -translate-x-1/2 overflow-hidden rounded-full border-8 border-night-950 bg-night-950"
    >
      <img width="160" height="160" [ngSrc]="character().image" alt="" />
    </div>

    <div class="flex h-20 shrink-0 items-start justify-end pt-8 pr-8">
      <button
        class="icon-btn -mt-2 -mr-2"
        aria-label="Close"
        i18n-aria-label="@@common.close"
        (click)="modal.close()"
      >
        <svg lucideX size="20"></svg>
      </button>
    </div>

    <div class="flex min-h-0 flex-col gap-5 overflow-y-auto px-7 pb-8">
      <div class="flex flex-col items-center gap-2">
        <h1 id="character-details-name" class="text-3xl">{{ character().name }}</h1>
        <app-divider class="w-48" />
      </div>

      @for (section of character().description; track section.title) {
        <section class="grid grid-cols-1 gap-x-5 gap-y-1 sm:grid-cols-[11rem_1fr]">
          <h2 class="text-lg">{{ section.title }}</h2>
          <p class="leading-relaxed">{{ section.description }}</p>
        </section>
      }
    </div>
  </div>
</dialog>
