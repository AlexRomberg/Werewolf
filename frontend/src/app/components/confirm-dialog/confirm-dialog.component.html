<dialog
  appModal
  #modal="appModal"
  class="surface m-auto w-[min(24rem,calc(100vw-2rem))] p-7 text-frost-200 shadow-2xl shadow-black/60"
  role="alertdialog"
  aria-labelledby="confirm-dialog-title"
  aria-describedby="confirm-dialog-message"
  (closed)="cancelled.emit()"
>
  <app-corners />
  <h1 id="confirm-dialog-title" class="text-2xl">{{ title() }}</h1>
  <p id="confirm-dialog-message" class="mt-2 text-frost-400">{{ message() }}</p>

  <div class="mt-6 grid grid-cols-2 gap-3">
    <button class="btn btn-secondary" autofocus (click)="modal.close()">
      {{ cancelLabel() }}
    </button>
    <button
      class="btn"
      [class.btn-danger]="destructive()"
      [class.btn-primary]="!destructive()"
      (click)="confirmed.emit()"
    >
      {{ confirmLabel() }}
    </button>
  </div>
</dialog>
