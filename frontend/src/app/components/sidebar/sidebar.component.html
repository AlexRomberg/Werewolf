@if (title()) {
  <header class="mb-4 flex shrink-0 items-center gap-1 max-md:hidden">
    @if (canGoBack()) {
      <button
        class="icon-btn -ml-2"
        aria-label="Back"
        i18n-aria-label="@@common.back"
        (click)="back.emit()"
      >
        <svg lucideChevronLeft size="22"></svg>
      </button>
    }
    <h1 class="truncate text-3xl">{{ title() }}</h1>
  </header>
}

<div class="grid min-h-0 flex-1">
  <ng-content />
</div>
