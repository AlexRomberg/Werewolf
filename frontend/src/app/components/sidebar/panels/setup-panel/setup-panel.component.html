<div class="flex min-h-0 flex-col gap-6 overflow-y-auto">
  <section class="flex flex-col gap-3">
    <div class="flex flex-col gap-1.5">
      <div class="flex items-center gap-2">
        <h2 class="section-title flex-1" i18n="@@setup.cards">Cards</h2>
        <span class="flex items-center gap-1 text-sm text-frost-400">
          <span aria-hidden="true">{{ players() }}</span>
          <svg lucideUsers size="16" aria-hidden="true"></svg>
          <span class="sr-only" i18n="@@setup.players">{{ players() }} players</span>
        </span>
      </div>
      <app-divider align="start" />
    </div>
    <button
      class="grid cursor-pointer grid-cols-[1fr_auto] grid-rows-[auto_3rem] gap-2 rounded-control border border-night-700 bg-night-800 p-4 text-left hover:border-frost-500"
      (click)="cardSelectorPressed.emit()"
    >
      <p class="text-frost-50" i18n="@@setup.cardsSelected">{{ cards().length }} Cards selected</p>
      <svg lucideChevronRight class="row-span-2 self-center text-frost-400"></svg>
      <app-deck-preview class="w-full max-w-80" [cards]="cards()" />
    </button>
  </section>

  <section class="flex flex-col gap-3">
    <div class="flex flex-col gap-1.5">
      <h2 class="section-title" i18n="@@setup.virtualCardsHeader">Virtual Cards</h2>
      <app-divider align="start" />
    </div>
    <app-toggle-switch
      id="virtual-cards"
      [checked]="virtualCards()"
      (checkedChange)="virtualCardsToggled.emit($event)"
    >
      <ng-container i18n="@@setup.virtualCards">Enable virtual cards</ng-container>
    </app-toggle-switch>
    <p class="text-sm text-frost-400" i18n="@@setup.virtualCardsHint">
      Players can join with their own device and see their card.
    </p>
  </section>
</div>

<div class="flex flex-col gap-3">
  @if (hasExcessCards()) {
    <p class="flex items-start gap-2 text-sm text-frost-400" role="status">
      <svg lucideTriangleAlert size="16" class="mt-0.5 shrink-0"></svg>
      <span i18n="@@setup.excessCards">There are more cards than players.</span>
    </p>
  }
  <button class="btn btn-primary" (click)="gameStartPressed.emit()" i18n="@@setup.start">
    Start
  </button>
</div>
