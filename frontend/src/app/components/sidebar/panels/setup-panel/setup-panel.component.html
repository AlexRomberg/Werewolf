<div class="flex min-h-0 flex-col gap-4 overflow-y-auto">
  <div class="flex flex-col gap-2 rounded-3xl bg-zinc-900 p-4 shadow shadow-zinc-950">
    <h2 class="text-lg font-bold text-zinc-300">Cards</h2>
    <button
      class="grid grid-cols-[1fr_auto] grid-rows-[auto_3rem] gap-2 rounded-lg bg-zinc-800 p-4 hover:bg-zinc-700"
      (click)="cardSelectorPressed.emit()"
    >
      <p class="text-start">{{ cards().length }} Cards selected</p>
      <svg lucideChevronRight class="row-span-2 self-center"></svg>
      <span
        class="relative w-80 max-w-80 mask-alpha overflow-x-clip mask-r-from-80% mask-r-to-100% rounded-sm"
      >
        @for (character of cards(); track $index) {
          <div
            class="absolute h-12 w-12 rounded-sm bg-zinc-950 p-1 shadow shadow-black/50"
            [style.left.px]="20 * $index"
            [style.zIndex]="30 - $index"
          >
            <img
              width="40"
              height="40"
              [ngSrc]="`img/${character.id}.png`"
              [alt]="'card ' + character.name"
            />
          </div>
        }
      </span>
    </button>
  </div>
</div>

<div class="flex flex-col gap-4 rounded-3xl bg-zinc-900 p-4 shadow shadow-zinc-950">
  <button class="btn btn-primary" (click)="gameStartPressed.emit()">
    Start <svg lucideArrowRight size="20"></svg>
  </button>
</div>
