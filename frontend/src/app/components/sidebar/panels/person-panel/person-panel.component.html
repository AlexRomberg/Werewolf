<div class="flex min-h-0 flex-col gap-6 overflow-y-auto">
  <section class="flex flex-col gap-2">
    <div
      class="mx-auto mb-2 grid size-28 place-items-center overflow-hidden rounded-full border border-night-700 bg-night-800"
    >
      @if (person().character; as character) {
        <img width="112" height="112" [ngSrc]="character.image" [alt]="character.name" />
      } @else {
        <svg lucideUser size="32" class="text-frost-500"></svg>
      }
    </div>
    <label class="input-label" for="person-name" i18n="@@person.name">Name</label>
    <input
      id="person-name"
      class="input"
      type="text"
      autocomplete="off"
      placeholder="Unnamed player"
      i18n-placeholder="@@person.unnamed"
      [ngModel]="person().name"
      (ngModelChange)="onNameInput($event)"
      (blur)="cleanName()"
    />
    <label class="input-label mt-2" for="person-character" i18n="@@person.character"
      >Character</label
    >
    <select
      id="person-character"
      class="input"
      autocomplete="off"
      [ngModel]="person().character?.id"
      (ngModelChange)="onCharacterSelect($event)"
    >
      @for (option of characterOptions(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </section>

  <section class="flex flex-col gap-3">
    <div class="flex flex-col gap-1.5">
      <h2 class="section-title" i18n="@@person.status">Status</h2>
      <app-divider align="start" />
    </div>
    <div class="flex flex-wrap gap-2">
      @for (option of statusOptions(); track option.status) {
        <button
          class="chip"
          [attr.aria-pressed]="option.active"
          (click)="toggleStatus(option.status)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </section>
</div>
