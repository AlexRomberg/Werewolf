<div class="flex min-h-0 flex-col gap-4 overflow-y-auto">
  <div class="sidebar-container">
    <span class="flex gap-2 items-baseline">
      <label class="input-label flex-1">Group by:</label>
      <button
        class="text-sm bg-zinc-800 hover:bg-zinc-700 rounded-full ring-amber-400 px-3 py-1"
        [class.ring-2]="grouping() === 'game'"
        (click)="grouping.set('game')"
      >
        Game
      </button>
      <button
        class="text-sm bg-zinc-800 hover:bg-zinc-700 rounded-full ring-amber-400 px-3 py-1"
        [class.ring-2]="grouping() === 'group'"
        (click)="grouping.set('group')"
      >
        Group
      </button>
    </span>
    <div class="grid grid-cols-2 gap-2">
      @for (section of sections(); track section.label) {
        <p class="col-span-2" [class.mt-2]="!$first">{{ section.label }}</p>
        @for (card of section.cards; track card.character.id) {
          @if (card.isBulk) {
            <div
              class="card-tile col-span-2 grid-cols-[auto_1fr_auto] gap-y-1"
              [class.ring-2]="card.selected"
            >
              <div class="size-12 bg-zinc-950 p-1 rounded-sm">
                <img
                  width="40"
                  height="40"
                  [ngSrc]="`img/${card.character.id}.png`"
                  [alt]="card.character.name"
                />
              </div>
              <span class="text-sm text-zinc-400"
                >{{ card.character.name }}
                @if (card.hint) {
                  <p class="col-start-2 col-span-2 text-xs text-zinc-500">{{ card.hint }}</p>
                }
              </span>
              <div class="flex items-center gap-2 text-zinc-400">
                <button
                  class="hover:text-zinc-100 disabled:opacity-30 disabled:hover:text-zinc-400"
                  [disabled]="!card.canDecrease"
                  [attr.aria-label]="'One fewer ' + card.character.name"
                  (click)="decrease(card)"
                >
                  <svg lucideCircleMinus></svg>
                </button>
                <span class="w-5 text-center text-sm tabular-nums">{{ card.amount }}</span>
                <button
                  class="hover:text-zinc-100 disabled:opacity-30 disabled:hover:text-zinc-400"
                  [disabled]="!card.canIncrease"
                  [attr.aria-label]="'One more ' + card.character.name"
                  (click)="increase(card)"
                >
                  <svg lucideCirclePlus></svg>
                </button>
              </div>
            </div>
          } @else {
            <button
              class="card-tile grid-cols-[auto_1fr] hover:bg-zinc-700"
              [class.ring-2]="card.selected"
              (click)="toggle(card)"
            >
              <div class="size-12 bg-zinc-950 p-1 rounded-sm">
                <img
                  width="40"
                  height="40"
                  [ngSrc]="`img/${card.character.id}.png`"
                  [alt]="card.character.name"
                />
              </div>
              <span class="text-sm text-zinc-400">{{ card.character.name }}</span>
            </button>
          }
        }
      }
    </div>
  </div>
</div>
<div class="sidebar-container">
  <h2 class="text-lg font-bold text-zinc-300">Presets</h2>
</div>
