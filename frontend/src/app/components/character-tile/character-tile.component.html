<button class="card-tile" [attr.aria-pressed]="selected() || null" (click)="pressed.emit()">
  <span
    class="portrait ring-ember-400 ring-offset-2 ring-offset-night-900"
    [class.ring-2]="selected()"
  >
    <img class="size-12 rounded-[7px]" width="48" height="48" [ngSrc]="character().image" alt="" />
    @if (selected()) {
      <span class="tick"><svg lucideCheck size="12" stroke-width="3"></svg></span>
    }
  </span>
  <span class="min-w-0 text-sm">{{ character().name }}</span>
</button>
