@for (character of cards(); track $index) {
  <span
    class="absolute size-12 rounded-[7px] bg-inset p-1 shadow-md shadow-black/60"
    [style.left.px]="20 * $index"
    [style.zIndex]="30 - $index"
  >
    <img
      class="rounded-[4px]"
      width="40"
      height="40"
      [ngSrc]="character.image"
      alt="card {{ character.name }}"
      i18n-alt="@@deck.cardAlt"
    />
  </span>
}
