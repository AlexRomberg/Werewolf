<button
  type="button"
  class="relative z-10 block aspect-square w-full rounded-3xl perspective-distant focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-amber-400 disabled:cursor-default"
  [disabled]="!character()"
  [attr.aria-pressed]="faceUp()"
  [attr.aria-label]="faceUp() ? faceDownLabel : turnAroundLabel"
  (click)="flipPressed.emit()"
>
  <div
    class="relative size-full transition-transform duration-700 ease-out transform-3d motion-reduce:transition-none"
    [class.rotate-y-180]="faceUp()"
  >
    <div
      class="absolute inset-0 overflow-hidden rounded-3xl bg-zinc-900 shadow-2xl shadow-black/70 ring-1 ring-amber-100/10 backface-hidden"
    >
      <img
        class="size-full object-cover opacity-40 saturate-50"
        ngSrc="img/night.png"
        width="360"
        height="360"
        priority
        alt=""
      />
      <div class="absolute inset-2 rounded-2xl border border-amber-100/15"></div>
      <div class="absolute inset-3.5 rounded-[10px] border border-amber-100/10"></div>
    </div>

    <div
      class="absolute inset-0 rotate-y-180 overflow-hidden rounded-3xl bg-zinc-900 shadow-2xl shadow-black/70 ring-1 ring-amber-100/20 backface-hidden"
    >
      @if (character(); as character) {
        <img
          class="size-full object-cover transition duration-700"
          [class.grayscale]="card().isDead"
          [class.brightness-75]="card().isDead"
          width="360"
          height="360"
          [ngSrc]="character.image"
          alt=""
        />
      }
    </div>
  </div>
</button>

@if (facts().length > 0) {
  <ul
    class="-mt-6 flex w-[88%] flex-col gap-2.5 rounded-b-2xl border border-t-0 border-zinc-800 bg-zinc-900/95 px-5 pb-4 pt-12 text-sm text-zinc-300 shadow-xl shadow-black/50 transition duration-500 motion-reduce:transition-none"
    [class.delay-300]="faceUp()"
    [class.-translate-y-full]="!faceUp()"
    [class.opacity-0]="!faceUp()"
    [inert]="!faceUp()"
    aria-label="What you know"
    i18n-aria-label="@@playerCard.facts"
  >
    @for (fact of facts(); track fact.text) {
      <li class="flex items-start gap-3" [attr.data-tone]="fact.tone">
        <span class="mt-0.5 shrink-0 text-tone">
          @switch (fact.kind) {
            @case ('dead') {
              <svg lucideTombstone size="16"></svg>
            }
            @case ('werewolf') {
              <svg lucidePawPrint size="16"></svg>
            }
            @case ('enchanted') {
              <svg lucideWandSparkles size="16"></svg>
            }
            @case ('love') {
              <svg lucideHeart size="16"></svg>
            }
            @case ('trust') {
              <svg lucideHandshake size="16"></svg>
            }
            @case ('sleepover') {
              <svg lucideHouse size="16"></svg>
            }
          }
        </span>
        {{ fact.text }}
      </li>
    }
  </ul>
}
