<button
  type="button"
  class="relative z-10 block aspect-square w-full cursor-pointer rounded-2xl perspective-distant disabled:cursor-default"
  [disabled]="!character()"
  [attr.aria-pressed]="faceUp()"
  [attr.aria-label]="faceUp() ? faceDownLabel : turnAroundLabel"
  (click)="flipPressed.emit()"
>
  <div
    class="relative size-full transition-transform duration-700 ease-out transform-3d motion-reduce:transition-none"
    [class.rotate-y-180]="faceUp()"
  >
    <div
      class="absolute inset-0 grid place-items-center overflow-hidden rounded-2xl border border-night-700 bg-night-900 shadow-[inset_0_0_0_14px_var(--color-inset),0_30px_60px_-24px_#000] backface-hidden"
    >
      <img class="size-1/2" ngSrc="img/moon.svg" width="160" height="160" priority alt="" />
    </div>

    <div
      class="absolute inset-0 rotate-y-180 overflow-hidden rounded-2xl border border-night-700 bg-inset p-3.5 shadow-[0_30px_60px_-24px_#000] backface-hidden"
    >
      @if (character(); as character) {
        <img
          class="size-full rounded-xs object-cover transition duration-700"
          [class.grayscale]="card().isDead"
          [class.brightness-75]="card().isDead"
          width="360"
          height="360"
          [ngSrc]="character.image"
          alt=""
        />
      }
    </div>
  </div>
</button>

@if (facts().length > 0) {
  <ul
    class="-mt-6 flex w-[88%] flex-col gap-2.5 rounded-b-surface border border-t-0 border-night-700 bg-night-900/95 px-5 pt-12 pb-4 text-frost-200 shadow-xl shadow-black/50 transition duration-500 motion-reduce:transition-none"
    [class.delay-300]="faceUp()"
    [class.-translate-y-full]="!faceUp()"
    [class.opacity-0]="!faceUp()"
    [inert]="!faceUp()"
    aria-label="What you know"
    i18n-aria-label="@@playerCard.facts"
  >
    @for (fact of facts(); track fact.text) {
      <li class="flex items-start gap-3" [attr.data-tone]="fact.tone">
        <span class="mt-0.5 shrink-0 text-tone">
          @switch (fact.kind) {
            @case ('dead') {
              <svg lucideTombstone size="16"></svg>
            }
            @case ('werewolf') {
              <svg lucidePawPrint size="16"></svg>
            }
            @case ('enchanted') {
              <svg lucideWandSparkles size="16"></svg>
            }
            @case ('love') {
              <svg lucideHeart size="16"></svg>
            }
            @case ('trust') {
              <svg lucideHandshake size="16"></svg>
            }
            @case ('sleepover') {
              <svg lucideHouse size="16"></svg>
            }
          }
        </span>
        {{ fact.text }}
      </li>
    }
  </ul>
}
